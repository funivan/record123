name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Build
        env:
          SIGN_ID: "-"
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git checkout "$GITHUB_REF_NAME"
          VERSION="$VERSION" ./build.sh --release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Record123-$VERSION.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Record123-$VERSION.zip" \
              --title "Record123 $VERSION" --generate-notes
          fi

      - name: Update Homebrew cask
        run: |
          SHA=$(shasum -a 256 "Record123-$VERSION.zip" | cut -d' ' -f1)
          git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/record123.rb
          sed -i '' -E "s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/record123.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update cask to $VERSION"
          git push origin main
