name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  lint-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck scripts/*.sh
