name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  lint-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck (bash)
        run: shellcheck scripts/uninstall.sh
      - name: Syntax check (zsh)
        run: |
          for script in scripts/build.sh scripts/release.sh; do
            zsh -n "$script"
          done
